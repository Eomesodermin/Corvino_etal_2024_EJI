name: parse-check
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install knitr
        run: Rscript --no-init-file -e 'install.packages("knitr", repos = "https://cloud.r-project.org")'
      - name: Check that every R script and notebook parses
        run: Rscript --no-init-file .github/check_parse.R .
